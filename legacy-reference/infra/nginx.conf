server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /gm {
    alias /usr/share/nginx/html/gm;
    try_files $uri $uri/ /gm/index.html;
  }
  location / {
    try_files $uri $uri/ /play/index.html;
  }

  # Cache static
  location ~* \.(js|css|png|jpg|jpeg|svg|woff2)$ {
    expires 1d;
    add_header Cache-Control "public,max-age=86400";
  }
}
