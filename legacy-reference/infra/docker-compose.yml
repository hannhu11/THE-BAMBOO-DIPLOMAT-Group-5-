# See docs/11_DEPLOY_ORACLE.md
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - ../redis-data:/data
    networks: [bamboo-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    volumes:
      - ../content:/app/content:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [bamboo-net]
    expose: ["3000"]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../frontend-player:/usr/share/nginx/html/play:ro
      - ../frontend-dashboard:/usr/share/nginx/html/gm:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [bamboo-net]
    expose: ["8080"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.tmpl:/etc/caddy/Caddyfile:ro
      - ../caddy_data:/data
      - ../caddy_config:/config
    depends_on:
      - api
      - web
    networks: [bamboo-net]

networks:
  bamboo-net:
    driver: bridge
