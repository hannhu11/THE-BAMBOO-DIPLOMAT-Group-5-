<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="International Law &amp; UN Bloc sigil">
  <defs>
    <linearGradient id="ug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DAD6C4"/><stop offset="1" stop-color="#5F7284"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#0D1815" stroke="url(#ug)" stroke-width="1.2"/>
  <!-- concentric charter rings -->
  <g fill="none" stroke="#DAD6C4" opacity=".85">
    <circle cx="100" cy="100" r="76" stroke-width="1"/>
    <circle cx="100" cy="100" r="60" stroke-width=".8" opacity=".8"/>
    <circle cx="100" cy="100" r="44" stroke-width=".6" opacity=".65"/>
    <circle cx="100" cy="100" r="28" stroke-width=".5" opacity=".5"/>
  </g>
  <!-- charter tablet -->
  <g stroke="#DAD6C4" fill="none" stroke-width="1.4">
    <rect x="70" y="70" width="60" height="60" rx="2"/>
    <line x1="78" y1="86" x2="122" y2="86"/>
    <line x1="78" y1="98" x2="122" y2="98"/>
    <line x1="78" y1="110" x2="122" y2="110"/>
    <line x1="78" y1="122" x2="108" y2="122"/>
  </g>
  <!-- balance -->
  <g stroke="#5F7284" stroke-width="1.2" fill="none">
    <line x1="100" y1="60" x2="100" y2="74"/>
    <line x1="82" y1="62" x2="118" y2="62"/>
    <circle cx="82" cy="66" r="3"/>
    <circle cx="118" cy="66" r="3"/>
  </g>
  <text x="100" y="182" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="3" fill="#DAD6C4">UN · INTERNATIONAL LAW</text>
</svg>
