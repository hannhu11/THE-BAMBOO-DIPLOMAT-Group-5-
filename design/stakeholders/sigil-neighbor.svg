<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Neighboring Power Bloc sigil">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C2A6"/><stop offset="1" stop-color="#7A2A2E"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#0D1815" stroke="url(#ng)" stroke-width="1.2"/>
  <!-- pressure arcs -->
