    <path d="M20 100 A80 80 0 0 1 180 100" stroke-width="1.4"/>
    <path d="M32 100 A68 68 0 0 1 168 100" stroke-width="1.0" opacity=".7"/>
    <path d="M46 100 A54 54 0 0 1 154 100" stroke-width=".8" opacity=".55"/>
  </g>
  <!-- compressed core -->
