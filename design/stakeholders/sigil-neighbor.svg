  </g>
  <g fill="#E8C2A6">
    <circle cx="100" cy="100" r="3.4"/>
  </g>
  <!-- radial tension ticks -->
  <g stroke="#E8C2A6" stroke-width="1">
    <line x1="100" y1="26" x2="100" y2="38"/>
    <line x1="26"  y1="100" x2="38" y2="100"/>
    <line x1="174" y1="100" x2="162" y2="100"/>
    <line x1="100" y1="174" x2="100" y2="162"/>
  </g>
  <text x="100" y="182" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="3" fill="#E8C2A6">NEIGHBORING · SECURITY</text>
