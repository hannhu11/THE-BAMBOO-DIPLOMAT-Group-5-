<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="The Bamboo Diplomat mark">
  <defs>
    <linearGradient id="bambooBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68A98F"/>
      <stop offset="1" stop-color="#1C5C47"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0DFB6"/>
      <stop offset=".5" stop-color="#B88A33"/>
      <stop offset="1" stop-color="#5C4416"/>
    </linearGradient>
    <radialGradient id="ink" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#0F3628"/>
      <stop offset="1" stop-color="#050807"/>
    </radialGradient>
  </defs>

  <!-- Ceremonial disc -->
  <circle cx="120" cy="120" r="112" fill="url(#ink)"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#goldRing)" stroke-width="1.2" opacity=".9"/>
  <circle cx="120" cy="120" r="94" fill="none" stroke="#B88A33" stroke-width=".6" opacity=".35"/>

  <!-- Three axes tick marks (Autonomy / Economy / Prestige) -->
  <g stroke="#D8B46D" stroke-width="1" opacity=".55">
    <line x1="120" y1="12" x2="120" y2="26"/>
    <line x1="218" y1="168" x2="206" y2="161"/>
    <line x1="22"  y1="168" x2="34"  y2="161"/>
  </g>

  <!-- Bamboo culm — three internodes, rising -->
  <g transform="translate(120 200)">
    <!-- culm -->
    <rect x="-9" y="-160" width="18" height="160" rx="6" fill="url(#bambooBlade)"/>
    <!-- internode rings -->
    <g fill="#0F3628" stroke="#D8B46D" stroke-width=".8">
      <rect x="-11" y="-52" width="22" height="4" rx="1.6"/>
      <rect x="-11" y="-100" width="22" height="4" rx="1.6"/>
      <rect x="-11" y="-148" width="22" height="4" rx="1.6"/>
    </g>
    <!-- left leaf -->
    <path d="M-8 -128 C -60 -140 -78 -108 -30 -96 C -50 -110 -30 -122 -8 -122 Z" fill="#2F7D62"/>
    <!-- right leaf -->
    <path d="M8 -76 C 60 -90 80 -58 32 -46 C 52 -60 32 -70 8 -70 Z" fill="#68A98F"/>
    <!-- roots -->
    <path d="M-14 0 C -22 -6 -30 -4 -34 4 M14 0 C 22 -6 30 -4 34 4 M0 0 C 0 -8 -6 -12 -8 -14 M0 0 C 0 -8 6 -12 8 -14"
          stroke="#8E6A24" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cardinal points -->
  <g fill="#D8B46D" opacity=".85">
    <circle cx="120" cy="12"  r="2"/>
    <circle cx="228" cy="120" r="2"/>
    <circle cx="120" cy="228" r="2"/>
    <circle cx="12"  cy="120" r="2"/>
  </g>
</svg>
