# ==============================================================================
# THE BAMBOO DIPLOMAT — Production Virtual Hosts (HTTP + HTTPS SSL)
# Certificate: /etc/letsencrypt/live/the-bamboo-diplomat.online/fullchain.pem
# ==============================================================================

# 1. Main domain & Player Mobile App (Port 80 & 443)
server {
    listen 80;
    listen 443 ssl;
    server_name the-bamboo-diplomat.online www.the-bamboo-diplomat.online player.the-bamboo-diplomat.online bamboo.161.118.196.170.nip.io player.161.118.196.170.nip.io;

    ssl_certificate /etc/letsencrypt/live/the-bamboo-diplomat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-bamboo-diplomat.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Player Web SPA
    location / {
        root /var/www/the-bamboo-diplomat/player-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Direct subpath for Public Screen (/screen/)
    location /screen/ {
        alias /var/www/the-bamboo-diplomat/public-screen/;
        index index.html;
        try_files $uri $uri/ /screen/index.html;
    }

    # Direct subpath for Game Master Console (/gm/)
    location /gm/ {
        alias /var/www/the-bamboo-diplomat/gm-console/;
        index index.html;
        try_files $uri $uri/ /gm/index.html;
    }

    # API REST endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Socket.IO Gateway
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8088/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

