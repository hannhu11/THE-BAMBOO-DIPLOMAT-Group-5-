# ==============================================================================
# THE BAMBOO DIPLOMAT — Nginx Reverse Proxy Configuration
# File target on Server 2: /etc/nginx/sites-available/bamboo-diplomat
# Reference: 06_SERVER_DEPLOYMENT_SECURITY_GUIDE.md §3
# ==============================================================================

# 1. Player Mobile App & WebSocket reverse proxy
server {
    listen 80;
    server_name bamboo.161.118.196.170.nip.io player.161.118.196.170.nip.io;

    # Static assets for Player Mobile Web
    location / {
        root /home/ubuntu/the-bamboo-diplomat/apps/player-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API REST endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Socket.IO real-time channel
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8088/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

